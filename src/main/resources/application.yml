server:
  port: 8080

spring:
  application:
    name: temple-donation-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jayaguru}
    username: ${DB_USERNAME:temple_app}
    password: ${DB_PASSWORD:temple123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: warn

app:
  jwt:
    secret: ${JWT_SECRET:temple-donation-app-dev-secret-key-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
